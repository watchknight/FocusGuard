<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Blocked by FocusGuard</title>
    <link rel="stylesheet" href="blocked.css">
</head>
<body>
    <div class="container fade-in">
        <div class="shield-container">
            <span class="shield-icon">🛡️</span>
        </div>
        <h1 class="title">Site Blocked by FocusGuard</h1>
        <p class="subtitle">We've protected you from <span id="blocked-domain" class="domain">this site</span></p>
        
        <div class="quote-container">
            <p class="quote-text" id="quote-text">Loading inspiration...</p>
            <p class="quote-author" id="quote-author"></p>
        </div>
        
        <div class="stats-container">
            <span class="stats-badge" id="stats-counter">You've blocked 0 attempts so far. Keep going!</span>
        </div>
        
        <p class="subtle-message">Protection is active. Stay strong.</p>
        
        <div class="button-group">
            <button id="btn-back" class="btn btn-secondary">Go Back</button>
            <button id="btn-home" class="btn btn-primary">Go Home</button>
        </div>
    </div>
    <script src="blocked.js"></script>
</body>
</html>
